name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against the minimum we declare (engines) and the runtime we ship in Docker.
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Syntax check
        run: node --check server.js
        working-directory: backend

      - name: Compile EJS templates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ejs = require('ejs');

          function compileTemplates(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) compileTemplates(file);
              else if (entry.name.endsWith('.ejs')) {
                ejs.compile(fs.readFileSync(file, 'utf8'), { filename: file });
              }
            }
          }

          compileTemplates(path.join(process.cwd(), 'views'));
          NODE
        working-directory: backend

      - name: Smoke test — logger loads and emits
        run: |
          node -e "
            const pino = require('pino');
            const logger = pino({ level: 'info' });
            logger.info({ test: true }, 'ci smoke test');
          "
        working-directory: backend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: applegate-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
